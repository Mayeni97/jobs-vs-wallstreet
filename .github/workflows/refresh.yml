name: nightly-refresh

on:
  schedule:
    - cron: "0 14 * * *"  # 14:00 UTC, after the usual BLS release window
  workflow_dispatch:       # allow manual run from Actions tab

concurrency:
  group: supabase-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      PGHOST:     ${{ secrets.PGHOST }}
      PGPORT:     ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER:     ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
      BLS_START_YEAR: "2000"
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch BLS headline unemployment
        run: python etl/bls_ingest.py

      - name: Fetch BLS CES supersectors
        run: python etl/bls_ces_ingest.py

      - name: Fetch BLS state unemployment
        run: python etl/laus_ingest.py

      - name: Fetch equities/ETFs
        run: python etl/stocks_ingest.py

      - name: Load all CSVs into Postgres
        run: python etl/load_to_db.py

      - name: Validate refreshed data
        run: python tests/test.py
