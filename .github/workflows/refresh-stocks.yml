name: refresh-stocks

on:
  schedule:
    - cron: "0 14 * * *" # daily at 14:00 UTC
  workflow_dispatch:

concurrency:
  group: supabase-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python etl/stocks_ingest.py
      - run: python etl/load_to_db.py
      - run: python tests/verify_db.py
      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.csv
          if git diff --cached --quiet; then echo "No CSV changes"; else git commit -m "Refresh stock snapshot"; git push; fi
